name: Build addon zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin.video.corridor/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zip, update news, prune old zips
        run: python .github/scripts/build_zip.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build addon zip"
          git push
